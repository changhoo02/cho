name: keep-alive

# Render 무료 플랜은 15분간 요청이 없으면 잠든다.
# 10분마다 /healthz 를 핑해서 깨어 있게 유지한다. (클릭 기록은 남지 않음)
on:
  schedule:
    - cron: "*/10 * * * *"   # 10분마다 실행 (GitHub 부하에 따라 몇 분 늦어질 수 있음)
  workflow_dispatch:          # 수동 실행 버튼도 제공

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          curl -fsS --max-time 30 https://phish-train-0w8v.onrender.com/healthz && echo " <- awake"
